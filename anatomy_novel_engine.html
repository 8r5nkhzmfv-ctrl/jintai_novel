<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>人体を巡る者たち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0F1626;
    --bg-panel:#16223B;
    --bg-panel-2:#1D2C4A;
    --accent-artery:#E2492F;
    --accent-vein:#3FA9A0;
    --text-main:#EDE6D6;
    --text-sub:#A9B4C9;
    --text-lock:#3C4A66;
    --line-lock:#22304C;
    /* フェーズ別アクセントカラー（企画書 第0章に準拠） */
    --p2-red:#B23A2E;
    --p3-purple:#5B3A82;
    --p3-gold:#C9A24B;
    --p4-teal:#3F8F86;
    --p4-brown:#8A5A3C;
    --p5-steel:#37516B;
    --p6-silver:#9AA5B1;
    --p7-aqua:#5FAFC4;
    --p7-green:#2E5C4A;
  }
  :root{ --vh: 1vh; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-void);color:var(--text-main);font-family:'Zen Kaku Gothic New',sans-serif;overflow:hidden;}
  #app{
    position:relative;width:100%;max-width:720px;margin:0 auto;
    background:radial-gradient(ellipse at 50% -10%, #1B2A4A 0%, var(--bg-void) 60%);
    height:100vh;              /* 古いブラウザ向けフォールバック */
    height:100svh;             /* ブラウザUIが最大表示された状態でも収まる最小ビューポート */
    height:calc(var(--vh, 1vh) * 100); /* JSで実測した高さ（最終的にこれが優先される） */
  }

  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- Title ---------- */
  #title-screen{
    align-items:center;justify-content:center;text-align:center;gap:28px;
    padding:24px 24px calc(24px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  #title-screen h1{font-family:'Shippori Mincho',serif;font-size:2.1rem;letter-spacing:.08em;margin:0;line-height:1.5;}
  #title-screen p{color:var(--text-sub);font-size:.85rem;letter-spacing:.05em;margin:0;}
  .vessel-pulse{width:2px;height:70px;background:linear-gradient(var(--accent-artery),transparent);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
  .btn{
    font-family:'Zen Kaku Gothic New',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:.05em;
    background:var(--accent-artery);color:#fff;border:none;border-radius:2px;
    padding:14px 32px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(226,73,47,.35);}
  .btn.secondary{background:transparent;color:var(--text-sub);border:1px solid var(--line-lock);}
  .btn.secondary:hover{color:var(--text-main);border-color:var(--text-sub);box-shadow:none;}

  /* ---------- Scene Track (振り返り一覧) ---------- */
  #track-screen{padding:28px 20px calc(20px + env(safe-area-inset-bottom));overflow:hidden;}
  #track-screen h2{font-family:'Shippori Mincho',serif;font-size:1.15rem;margin:0 0 4px;}
  #track-screen .hint{color:var(--text-sub);font-size:.75rem;margin:0 0 18px;}
  #track-list{flex:1;overflow-y:auto;position:relative;padding-left:26px;padding-bottom:24px;}
  #track-list::before{
    content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line-lock);
  }
  .track-phase-label{
    font-family:'Shippori Mincho',serif;font-size:.8rem;color:var(--text-sub);
    margin:18px 0 8px;letter-spacing:.08em;
  }
  .track-phase-label:first-child{margin-top:0;}
  .track-node{position:relative;padding:9px 0 9px 16px;cursor:pointer;}
  .track-node::before{
    content:'';position:absolute;left:-21px;top:15px;width:9px;height:9px;border-radius:50%;
    background:var(--bg-void);border:2px solid var(--line-lock);
  }
  .track-node .label{font-size:.85rem;color:var(--text-lock);transition:color .2s;}
  .track-node.lit::before{background:var(--accent-artery);border-color:var(--accent-artery);box-shadow:0 0 8px rgba(226,73,47,.6);}
  .track-node.lit .label{color:var(--text-main);}
  .track-node.locked{cursor:default;}
  .track-node.current::before{background:var(--accent-vein);border-color:var(--accent-vein);}
  #track-screen .footer-row{padding-top:10px;border-top:1px solid var(--line-lock);}

  /* ---------- Player ---------- */
  #player-screen{justify-content:flex-end;position:relative;}
  #scene-bg{flex:1;position:relative;overflow:hidden;z-index:1;}
  #bg-image{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .5s ease;
  }
  #bg-image.show{opacity:.92;}

  /* キャラクター画像：#player-screen直下に配置し、メッセージウィンドウへ
     食い込むよう大きく表示する。z-indexはtopbarより下・dialogue-boxより下
     （dialogue-boxの半透明グラデーションで足元が自然に隠れる） */
  #char-image{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    height:118%;max-height:920px;object-fit:contain;
    filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));
    opacity:0;transition:opacity .35s ease;
    z-index:2;pointer-events:none;
  }
  #char-image.show{opacity:1;}

  /* ---------- 検査値バッジ（画像なし・CSSでデザイン） ---------- */
  #lab-badge{
    position:absolute;bottom:22%;left:50%;transform:translateX(-50%) scale(.85);
    display:none;flex-direction:column;align-items:center;gap:8px;
    opacity:0;transition:opacity .35s ease, transform .35s ease;
    z-index:2;
  }
  #lab-badge.show{display:flex;opacity:1;transform:translateX(-50%) scale(1);}
  #lab-badge .badge-ring{
    width:120px;height:120px;border-radius:50%;
    background:var(--bg-panel-2);
    border:3px solid var(--badge-color, var(--accent-vein));
    box-shadow:0 0 22px color-mix(in srgb, var(--badge-color, var(--accent-vein)) 45%, transparent);
    display:flex;align-items:center;justify-content:center;
  }
  #lab-badge .badge-label{
    font-family:'Shippori Mincho',serif;font-weight:700;font-size:1.3rem;
    color:var(--badge-color, var(--accent-vein));letter-spacing:.02em;
  }
  #lab-badge .badge-caption{
    font-size:.7rem;color:var(--text-sub);letter-spacing:.1em;
  }
  #dialogue-box{
    position:relative;z-index:3;
    background:linear-gradient(180deg, rgba(22,34,59,0) 0%, var(--bg-panel) 22%);
    padding:18px 22px calc(26px + env(safe-area-inset-bottom));
    min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;
    flex-shrink:0;
  }
  #speaker-name{
    font-family:'Shippori Mincho',serif;font-weight:700;color:var(--accent-vein);font-size:.95rem;letter-spacing:.05em;
  }
  #dialogue-text{font-size:1rem;line-height:1.85;min-height:3.7em;}
  #advance-hint{align-self:flex-end;color:var(--text-sub);font-size:.7rem;animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}
  #player-screen.clickable{cursor:pointer;}

  /* ---------- Quiz ---------- */
  #quiz-overlay{
    position:absolute;inset:0;background:rgba(15,22,38,.94);display:none;
    flex-direction:column;justify-content:center;gap:16px;
    padding:28px 28px calc(28px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  #quiz-overlay.active{display:flex;}
  #quiz-overlay .tag{font-size:.7rem;color:var(--accent-artery);letter-spacing:.15em;font-weight:700;}
  #quiz-overlay .q-text{font-family:'Shippori Mincho',serif;font-size:1.05rem;line-height:1.7;}
  .q-options{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .q-option{
    text-align:left;background:var(--bg-panel-2);border:1px solid var(--line-lock);color:var(--text-main);
    padding:13px 16px;border-radius:2px;font-size:.9rem;cursor:pointer;font-family:'Zen Kaku Gothic New',sans-serif;
    transition:border-color .15s;
  }
  .q-option:hover{border-color:var(--accent-vein);}
  #q-feedback{font-size:.85rem;color:var(--text-sub);line-height:1.7;display:none;}
  #q-feedback.show{display:block;}
  #q-feedback .verdict{font-weight:700;color:var(--accent-vein);}

  /* ---------- Bad End ---------- */
  #badend-overlay{
    position:absolute;inset:0;background:#0A0D16;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
    padding:30px 30px calc(30px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  #badend-overlay.active{display:flex;}
  .glitch-vessel{width:140px;height:140px;position:relative;}
  .glitch-vessel svg{width:100%;height:100%;}
  .glitch-vessel path{stroke:var(--accent-artery);stroke-width:3;fill:none;opacity:.85;animation:flicker 1.1s infinite;}
  @keyframes flicker{0%,100%{opacity:.85;stroke:var(--accent-artery);}45%{opacity:.2;}50%{opacity:.9;stroke:#8a1f10;}55%{opacity:.2;}}
  #badend-overlay h3{font-family:'Shippori Mincho',serif;color:var(--accent-artery);font-size:1.1rem;margin:0;letter-spacing:.05em;}
  #badend-overlay p{color:var(--text-sub);font-size:.88rem;line-height:1.8;max-width:480px;margin:0;}

  #topbar{
    display:flex;justify-content:space-between;align-items:center;padding:14px 18px;
    color:var(--text-sub);font-size:.75rem;position:relative;z-index:10;
    background:linear-gradient(180deg, rgba(15,22,38,.65) 0%, rgba(15,22,38,0) 100%);
  }
  #region-tag{
    display:block;font-family:'Shippori Mincho',serif;font-size:.7rem;
    color:var(--text-sub);letter-spacing:.1em;margin-top:2px;opacity:.85;
  }
  #topbar button{background:none;border:none;color:var(--text-sub);font-size:.75rem;cursor:pointer;font-family:inherit;}
  #topbar button:hover{color:var(--text-main);}
  #topbar .topbar-right{display:flex;align-items:center;gap:14px;}
  #btn-mute{font-size:1rem;}
</style>
</head>
<body>
<div id="app">

  <!-- ===== タイトル ===== -->
  <div id="title-screen" class="screen active">
    <h1>人体を巡る者たち</h1>
    <div class="vessel-pulse"></div>
    <p>健康・医療の学習ガイドを原作としたノベルゲーム</p>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px;">
      <button class="btn" id="btn-start">はじめる</button>
      <button class="btn secondary" id="btn-continue">シーンを振り返る</button>
    </div>
  </div>

  <!-- ===== シーン振り返り（血管ライン） ===== -->
  <div id="track-screen" class="screen">
    <h2>これまでの記録</h2>
    <p class="hint">明るい項目はタップして再開できます。暗い項目はまだ到達していません。</p>
    <div id="track-list"></div>
    <div class="footer-row">
      <button class="btn secondary" id="btn-track-back">タイトルへ戻る</button>
    </div>
  </div>

  <!-- ===== プレイ画面 ===== -->
  <div id="player-screen" class="screen">
    <div id="topbar">
      <span>
        <span id="phase-title-tag"></span>
        <span id="region-tag"></span>
      </span>
      <div class="topbar-right">
        <button id="btn-mute">🔊</button>
        <button id="btn-open-track">記録を見る</button>
      </div>
    </div>
    <div id="scene-bg">
      <img id="bg-image" src="" alt="">
    </div>
    <img id="char-image" src="" alt="">
    <div id="lab-badge">
      <div class="badge-ring"><span class="badge-label"></span></div>
      <span class="badge-caption">検査値</span>
    </div>
    <div id="dialogue-box">
      <div id="speaker-name"></div>
      <div id="dialogue-text"></div>
      <div id="advance-hint">タップして進む ▸</div>
    </div>

    <!-- クイズオーバーレイ -->
    <div id="quiz-overlay">
      <div class="tag" id="quiz-tag">問題</div>
      <div class="q-text" id="quiz-question"></div>
      <div class="q-options" id="quiz-options"></div>
      <div id="q-feedback"><span class="verdict"></span> <span class="detail"></span></div>
    </div>

    <!-- バッドエンドオーバーレイ -->
    <div id="badend-overlay">
      <div class="glitch-vessel">
        <svg viewBox="0 0 140 140">
          <path d="M20,70 Q40,20 70,70 T120,70" />
          <path d="M20,90 Q45,110 70,90 T120,90" />
          <path d="M20,50 Q45,30 70,50 T120,50" />
        </svg>
      </div>
      <h3 id="badend-title">均衡が崩れた</h3>
      <p id="badend-text"></p>
      <button class="btn" id="btn-retry">もう一度考える</button>
    </div>
  </div>

</div>

<audio id="bgm-a" loop preload="none"></audio>
<audio id="bgm-b" loop preload="none"></audio>

<script>
/* ---------- モバイルブラウザのアドレスバー対策 ----------
   Safari等はvh/dvh/svhの解釈がバージョン・状況によって不安定なため、
   window.innerHeight（実際に見えている高さ）を都度CSS変数に反映する。
------------------------------------------------------- */
function setRealVH(){
  document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
}
setRealVH();
window.addEventListener('resize', setRealVH);
window.addEventListener('orientationchange', ()=> setTimeout(setRealVH, 150));
// Safariはアドレスバーの出入りをresizeイベントで即座に拾わない場合があるため、
// visualViewportがあればそちらも監視する
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setRealVH);
}

/* =========================================================
   データ構造の説明
   ---------------------------------------------------------
   PHASES[].scenes[] の各要素は以下のいずれか：

   line 型（通常セリフ）:
     { id, type:'line', speaker, text, region,
       bg:'BG01'などの背景ID（images/BG01.jpg を参照、768×1376のJPEG）,
       charImg:'C01-a'などのキャラ画像ID（images/C01-a.png を参照、透過PNG）,
       bgm:'usual'|'battle'（audio/○○.mp3 を参照。2種類のみ。
         ここぞという場面でのみ切り替え、それ以外は同じ曲を
         長く流し続けること） }
     ※ track（振り返り一覧）に載る「メインの筋」の一部

   quiz 型（分岐/知識確認クイズ）:
     { id, type:'quiz', badEnd:true/false, question, bg, bgm,
       options:[{text, correct:true/false, feedback}],
       onCorrectNext: 次のシーンid,
       onWrongNext: badEnd時のみ→バッドエンドシーンid
     }
     ※ badEnd:false の場合、誤答は同じ quiz にとどまり解説を表示

   badend 型:
     { id, type:'badend', title, text, retryTarget: 戻り先quiz id,
       bg, bgm }

   bg / charImg / bgm はすべて省略可（未指定ならその場は変化しない）。
   画像ファイルが images/ に無い場合はエラーを握りつぶし、
   単に画像なしで進行する（レイアウトは崩れない）。

   他フェーズを追加する場合、この形式で PHASES 配列に
   要素を追加するだけでよい。
========================================================= */

const PHASES = [
  {
    id: 'phase1',
    title: 'フェーズ1｜恒常性本部',
    scenes: [
      {id:'p1-1', type:'line', region:'恒常性本部', speaker:'制御中枢長官', text:'ようこそ、恒常性本部へ。この体を守る仕組みは単純だ——狂ったら、戻す。それだけだ。', bg:'BG01', charImg:'C01-a', bgm:'usual'},
      {id:'p1-2', type:'line', region:'恒常性本部', speaker:'センサー（体温担当）', text:'私たちセンサーは常に外と中の状態を見張ってる。何かがズレたら、すぐ長官に報告するの。', bg:'BG01', charImg:'C02-a', bgm:'usual'},
      {id:'p1-3', type:'line', region:'恒常性本部', speaker:'制御中枢長官', text:'報告を受けたら私が判断し、指令を出す。そして——', bg:'BG01', charImg:'C01-a', bgm:'usual'},
      {id:'p1-4', type:'line', region:'恒常性本部', speaker:'効果器（汗腺）', text:'指令が来たら、俺たち効果器が実際に体を動かす番だ。センサー→中枢→効果器。この3段階、覚えとけよ新人。', bg:'BG01', charImg:'S01', bgm:'usual'},

      {id:'p1-5', type:'line', region:'循環器街 体温イベント', speaker:'センサー（体温担当）', text:'長官！ 皮膚と視床下部の温度受容器が異常値を検知！ 体温が上昇してます！', bg:'BG01', charImg:'C02-b', bgm:'usual'},
      {id:'p1-6', type:'line', region:'循環器街 体温イベント', speaker:'制御中枢長官', text:'受理した。効果器隊、出動——汗腺は発汗、血管は拡張しろ。放熱で下げる。', bg:'BG01', charImg:'C01-b', bgm:'usual'},
      {id:'p1-7', type:'line', region:'循環器街 体温イベント', speaker:'効果器（血管）', text:'拡張、開始……体温、低下し始めています。', bg:'BG01', charImg:'C03-b', bgm:'usual'},
      {id:'p1-8', type:'line', region:'循環器街 体温イベント', speaker:'センサー（体温担当）', text:'基準値に戻った……！ これが『上がったら、下げる方向に打ち消す』——負のフィードバックなんですね。', bg:'BG01', charImg:'C02-a', bgm:'usual'},

      {id:'p1-9', type:'line', region:'血糖イベント', speaker:'センサー（血糖担当）', text:'長官、今度は血糖です！ 食後、急上昇しています！', bg:'BG01', charImg:'S02', bgm:'usual'},
      {id:'p1-10', type:'line', region:'血糖イベント', speaker:'インスリン', text:'呼ばれて参上。肝臓・筋肉・脂肪細胞のみんな、糖を取り込め！ 肝臓はグリコーゲンにして貯蔵だ。', bg:'BG01', charImg:'C07-b', bgm:'usual'},
      {id:'p1-11', type:'line', region:'血糖イベント', speaker:'インスリン', text:'……よし、下がった。上がったら下げる。これも同じ仕組みだな。', bg:'BG01', charImg:'C07-a', bgm:'usual'},

      {id:'p1-quiz1', type:'quiz', badEnd:true, region:'血糖イベント', bg:'BG01', bgm:'battle',
        question:'空腹時、血糖値が下がりすぎたとき、体は何をして血糖を維持するか？',
        options:[
          {text:'A. インスリンをさらに分泌して血糖を下げ続ける', correct:false},
          {text:'B. グルカゴンを分泌し、グリコーゲンの分解と糖新生で血糖を上げる', correct:true},
          {text:'C. 何もせず自然に回復するのを待つ', correct:false}
        ],
        onCorrectNext:'p1-12', onWrongNext:'p1-badend1'
      },
      {id:'p1-badend1', type:'badend', bg:'BG15', bgm:'battle',
        title:'均衡が崩れた',
        text:'血糖が下がり続け、本部の機能が停止していく……。低血糖を放置すると、意識障害など深刻な事態につながる。もう一度、仕組みを考え直そう。',
        retryTarget:'p1-quiz1'
      },
      {id:'p1-12', type:'line', region:'血糖イベント', speaker:'グルカゴン', text:'その通り。上げ下げ両方向、俺たちで支えてる。', bg:'BG01', charImg:'C08-a', bgm:'usual'},

      {id:'p1-13', type:'line', region:'血圧イベント', speaker:'センサー（血圧担当）', text:'長官！ 頸動脈洞と大動脈弓の圧受容器が反応！ 血圧上昇です！', bg:'BG01', charImg:'S03', bgm:'usual'},
      {id:'p1-14', type:'line', region:'血圧イベント', speaker:'制御中枢（延髄）', text:'受理。副交感神経、活性化しろ——心臓の拍数を落とせ、血管は拡張だ。', bg:'BG01', charImg:'C01-b', bgm:'usual'},
      {id:'p1-15', type:'line', region:'血圧イベント', speaker:'効果器（心臓）', text:'……拍数、低下。血圧、正常範囲に戻りました。', bg:'BG01', charImg:'C04-a', bgm:'usual'},
      {id:'p1-16', type:'line', region:'血圧イベント', speaker:'センサー（血圧担当）', text:'体温、血糖、血圧……全部同じ形をしてる。ズレを感知→中枢が判断→効果器が動く→戻る。これが恒常性の正体なんですね。', bg:'BG01', charImg:'S03', bgm:'usual'},

      {id:'p1-17', type:'line', region:'例外ゲスト', speaker:'オキシトシン', text:'待って。私たちは、逆——変化をもっと増幅する側なの。', bg:'BG01', charImg:'S04', bgm:'usual'},

/* =============== エンジン本体 =============== */
const STORAGE_KEY = 'anatomy_novel_progress_v1';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { furthestIndex: -1 };
  }catch(e){ return { furthestIndex: -1 }; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){/* 保存不可でも続行 */}
}

// 全フェーズの line 型シーンを1本の「振り返りライン」として平坦化
function buildFlatTrack(){
  const flat = [];
  PHASES.forEach(phase=>{
    phase.scenes.filter(s=>s.type==='line').forEach(s=>{
      flat.push({phaseId:phase.id, phaseTitle:phase.title, sceneId:s.id, label:s.text.slice(0,22)+'…'});
    });
  });
  return flat;
}
const FLAT_TRACK = buildFlatTrack();

let progress = loadProgress();
let currentPhase = null;
let currentSceneIndex = 0; // インデックス（phase.scenes内）
let pendingBadendRetry = null;

function findSceneGlobalTrackIndex(sceneId){
  return FLAT_TRACK.findIndex(t=>t.sceneId===sceneId);
}

function markReached(sceneId){
  const idx = findSceneGlobalTrackIndex(sceneId);
  if(idx > progress.furthestIndex){
    progress.furthestIndex = idx;
    saveProgress(progress);
  }
}

/* ---------- アセットパス設定（実際のフォルダ構成に合わせて変更可） ---------- */
const IMG_DIR = 'images/';
const AUDIO_DIR = 'audio/';

/* ---------- BGM（Web Audio APIのGainNodeで制御） ----------
   HTMLMediaElementの.volumeはiOS Safariで無視される仕様のため、
   Web Audio APIのGainNodeを介して音量制御・クロスフェード・
   ミュートを行う。usual／battleの2種類のみを使用し、
   ここぞという場面でのみ切り替える。
------------------------------------------------------- */
let audioCtx = null;
let masterGain = null;
const bgmNodes = {}; // 'a' | 'b' -> { el, gain }
let bgmActive = 'a';
let bgmCurrentKey = null;
let bgmMuted = false;

function initAudioGraph(){
  if(audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return; // 非対応環境では何もしない（音なしで進行）
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = bgmMuted ? 0 : 1;
  masterGain.connect(audioCtx.destination);

  ['a','b'].forEach(key=>{
    const el = document.getElementById('bgm-' + key);
    try{
      const src = audioCtx.createMediaElementSource(el);
      const gain = audioCtx.createGain();
      gain.gain.value = 0;
      src.connect(gain).connect(masterGain);
      bgmNodes[key] = { el, gain };
    }catch(e){ /* 既に接続済み等は無視 */ }
  });
}

function unlockAudioOnGesture(){
  initAudioGraph();
  if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
}

function playBgm(key){
  if(!key || key === bgmCurrentKey || !audioCtx) { bgmCurrentKey = key || bgmCurrentKey; return; }
  bgmCurrentKey = key;
  const nextId = bgmActive === 'a' ? 'b' : 'a';
  const activeNode = bgmNodes[bgmActive];
  const nextNode = bgmNodes[nextId];
  if(!activeNode || !nextNode) return;

  nextNode.el.src = AUDIO_DIR + key + '.mp3';
  nextNode.el.currentTime = 0;
  nextNode.el.play().catch(()=>{});

  const now = audioCtx.currentTime;
  const fadeTime = 1.6; // じっくりクロスフェード
  nextNode.gain.gain.cancelScheduledValues(now);
  nextNode.gain.gain.setValueAtTime(0, now);
  nextNode.gain.gain.linearRampToValueAtTime(1, now + fadeTime);

  activeNode.gain.gain.cancelScheduledValues(now);
  activeNode.gain.gain.setValueAtTime(activeNode.gain.gain.value, now);
  activeNode.gain.gain.linearRampToValueAtTime(0, now + fadeTime);

  const prevEl = activeNode.el;
  setTimeout(()=>{ prevEl.pause(); }, fadeTime * 1000 + 150);

  bgmActive = nextId;
}

document.getElementById('btn-mute').addEventListener('click', (e)=>{
  bgmMuted = !bgmMuted;
  e.target.textContent = bgmMuted ? '🔇' : '🔊';
  if(masterGain && audioCtx){
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setValueAtTime(bgmMuted ? 0 : 1, audioCtx.currentTime);
  }
});

/* ---------- 画面切り替え ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------- タイトル ---------- */
document.getElementById('btn-start').addEventListener('click', ()=>{
  unlockAudioOnGesture();
  startPhase('phase1', 0);
});
document.getElementById('btn-continue').addEventListener('click', ()=>{
  unlockAudioOnGesture();
  renderTrackScreen();
});
document.getElementById('btn-track-back').addEventListener('click', ()=> showScreen('title-screen'));
document.getElementById('btn-open-track').addEventListener('click', renderTrackScreen);

/* ---------- シーン振り返り（血管ライン） ---------- */
function renderTrackScreen(){
  const list = document.getElementById('track-list');
  list.innerHTML = '';
  let lastPhase = null;
  FLAT_TRACK.forEach((t, idx)=>{
    if(t.phaseTitle !== lastPhase){
      const label = document.createElement('div');
      label.className = 'track-phase-label';
      label.textContent = t.phaseTitle;
      list.appendChild(label);
      lastPhase = t.phaseTitle;
    }
    const node = document.createElement('div');
    const lit = idx <= progress.furthestIndex;
    node.className = 'track-node ' + (lit ? 'lit' : 'locked');
    if(idx === progress.furthestIndex) node.classList.add('current');
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = t.label;
    node.appendChild(lbl);
    if(lit){
      node.addEventListener('click', ()=> startPhase(t.phaseId, findSceneIndexInPhase(t.phaseId, t.sceneId)));
    }
    list.appendChild(node);
  });
  showScreen('track-screen');
}

function findSceneIndexInPhase(phaseId, sceneId){
  const phase = PHASES.find(p=>p.id===phaseId);
  return phase.scenes.findIndex(s=>s.id===sceneId);
}

/* ---------- プレイヤー ---------- */
function startPhase(phaseId, sceneIndex){
  currentPhase = PHASES.find(p=>p.id===phaseId);
  currentSceneIndex = sceneIndex;
  document.getElementById('phase-title-tag').textContent = currentPhase.title;
  showScreen('player-screen');
  renderCurrentScene();
}

function renderCurrentScene(){
  const scene = currentPhase.scenes[currentSceneIndex];
  document.getElementById('quiz-overlay').classList.remove('active');
  document.getElementById('badend-overlay').classList.remove('active');

  // 背景・BGMはシーン種別に関わらず反映（値がある場合のみ）
  applyBackground(scene.bg);
  playBgm(scene.bgm);

  if(scene.type === 'line'){
    markReached(scene.id);
    document.getElementById('region-tag').textContent = scene.region || '';
    document.getElementById('speaker-name').textContent = scene.speaker || '';
    document.getElementById('dialogue-text').textContent = scene.text;
    document.getElementById('player-screen').classList.add('clickable');
    applyCharImage(scene.charImg);
  } else if(scene.type === 'quiz'){
    applyCharImage(null);
    renderQuiz(scene);
  } else if(scene.type === 'badend'){
    applyCharImage(null);
    renderBadend(scene);
  }
}

let currentBgId = null;
function applyBackground(bgId){
  const el = document.getElementById('bg-image');
  if(!bgId){ el.classList.remove('show'); currentBgId = null; return; }
  if(bgId === currentBgId){ el.classList.add('show'); return; }
  currentBgId = bgId;
  el.classList.remove('show');
  const src = IMG_DIR + bgId + '.jpg'; // 背景はJPEG・768×1376（縦長）で用意される想定
  const img = new Image();
  img.onload = ()=>{ el.src = src; el.classList.add('show'); };
  img.onerror = ()=>{ el.classList.remove('show'); }; // 画像未配置でもレイアウトは崩さない
  img.src = src;
}

/* ---------- 検査値キャラクター（画像なし・CSSバッジで表示） ---------- */
const LAB_VALUES = {
  'S20': {label:'Hb',      color:'var(--p2-red)'},
  'S21': {label:'CRP',     color:'var(--p2-red)'},
  'S22': {label:'HbA1c',   color:'var(--p3-gold)'},
  'S23': {label:'AST/ALT', color:'var(--p4-teal)'},
  'S24': {label:'γ-GTP',   color:'var(--p4-teal)'},
  'S25': {label:'Alb',     color:'var(--p4-teal)'},
  'S26': {label:'Cr',      color:'var(--p4-teal)'},
  'S27': {label:'eGFR',    color:'var(--p4-teal)'}
};

let currentCharId = null;
function applyCharImage(charId){
  const imgEl = document.getElementById('char-image');
  const badgeEl = document.getElementById('lab-badge');

  if(!charId){
    imgEl.classList.remove('show');
    badgeEl.classList.remove('show');
    currentCharId = null;
    return;
  }

  // 検査値キャラクター → CSSバッジ表示（画像を使わない）
  if(LAB_VALUES[charId]){
    imgEl.classList.remove('show');
    if(charId === currentCharId){ badgeEl.classList.add('show'); return; }
    currentCharId = charId;
    const info = LAB_VALUES[charId];
    badgeEl.style.setProperty('--badge-color', info.color);
    badgeEl.querySelector('.badge-label').textContent = info.label;
    badgeEl.classList.add('show');
    return;
  }

  // 通常キャラクター → 画像表示
  badgeEl.classList.remove('show');
  if(charId === currentCharId){ imgEl.classList.add('show'); return; }
  currentCharId = charId;
  imgEl.classList.remove('show');
  const src = IMG_DIR + charId + '.png';
  const img = new Image();
  img.onload = ()=>{ imgEl.src = src; imgEl.classList.add('show'); };
  img.onerror = ()=>{ imgEl.classList.remove('show'); };
  img.src = src;
}

document.getElementById('player-screen').addEventListener('click', (e)=>{
  const scene = currentPhase.scenes[currentSceneIndex];
  if(scene.type !== 'line') return; // クイズ/バッドエンド中はテキストタップで進めない
  if(e.target.closest('#topbar')) return;
  advance();
});

function advance(){
  if(currentSceneIndex < currentPhase.scenes.length - 1){
    currentSceneIndex++;
    renderCurrentScene();
  } else {
    // フェーズ終端：暫定でタイトルへ
    showScreen('title-screen');
  }
}

/* ---------- クイズ ---------- */
function renderQuiz(scene){
  document.getElementById('quiz-tag').textContent = scene.badEnd ? '分岐クイズ' : '知識確認クイズ';
  document.getElementById('quiz-question').textContent = scene.question;
  const optWrap = document.getElementById('quiz-options');
  optWrap.innerHTML = '';
  const feedback = document.getElementById('q-feedback');
  feedback.classList.remove('show');

  scene.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'q-option';
    btn.textContent = opt.text;
    btn.addEventListener('click', ()=>{
      if(opt.correct){
        markReached(scene.id);
        jumpTo(scene.onCorrectNext);
      } else {
        if(scene.badEnd){
          jumpTo(scene.onWrongNext);
        } else {
          feedback.querySelector('.verdict').textContent = 'もう一度考えてみよう。';
          feedback.querySelector('.detail').textContent = opt.feedback || '';
          feedback.classList.add('show');
        }
      }
    });
    optWrap.appendChild(btn);
  });

  document.getElementById('quiz-overlay').classList.add('active');
}

function jumpTo(sceneId){
  if(!sceneId){ advance(); return; }
  const idx = currentPhase.scenes.findIndex(s=>s.id===sceneId);
  if(idx === -1) return;
  currentSceneIndex = idx;
  renderCurrentScene();
}

/* ---------- バッドエンド ---------- */
function renderBadend(scene){
  document.getElementById('badend-title').textContent = scene.title;
  document.getElementById('badend-text').textContent = scene.text;
  pendingBadendRetry = scene.retryTarget;
  document.getElementById('badend-overlay').classList.add('active');
}
document.getElementById('btn-retry').addEventListener('click', ()=>{
  if(pendingBadendRetry) jumpTo(pendingBadendRetry);
});
</script>
